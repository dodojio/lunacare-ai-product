<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30363d"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">LunaCare AI 产品逻辑图</text>
  <text x="480" y="64" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">AI Product Logic · Input → Prediction → Output → Product Layer</text>

  <!-- Layer 1: User Data -->
  <rect x="60" y="90" width="200" height="40" rx="6" fill="#1c2128" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" fill="#79c0ff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">📥 User Data</text>

  <rect x="40" y="145" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="160" y="168" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Cycle History（周期历史）</text>

  <rect x="40" y="189" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="160" y="212" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Sleep Data（睡眠数据）</text>

  <rect x="40" y="233" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="160" y="256" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Symptoms（症状记录）</text>

  <rect x="40" y="277" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="160" y="300" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Stress Level（压力指数）</text>

  <rect x="40" y="321" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="160" y="344" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Activity（运动数据）</text>

  <!-- Arrow to Prediction -->
  <line x1="280" y1="230" x2="340" y2="230" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Prediction System -->
  <rect x="350" y="170" width="260" height="120" rx="10" fill="#0d2818" stroke="#238636" stroke-width="2" filter="url(#shadow2)"/>
  <text x="480" y="200" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">🧠 Prediction System</text>
  <text x="480" y="225" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">XGBoost + LSTM 混合模型</text>
  <text x="480" y="248" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">多协变量时序预测</text>
  <text x="480" y="271" text-anchor="middle" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="10">+ 置信度计算引擎（规则+模型）</text>

  <!-- Arrow to Output -->
  <line x1="610" y1="230" x2="670" y2="230" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Output -->
  <rect x="680" y="90" width="240" height="40" rx="6" fill="#1c2128" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="800" y="115" text-anchor="middle" fill="#d2a8ff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">📤 Output</text>

  <rect x="680" y="145" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="800" y="168" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Expected Date（预测日期）</text>

  <rect x="680" y="189" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="800" y="212" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Prediction Range（置信区间 ±N天）</text>

  <rect x="680" y="233" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="800" y="256" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Confidence（置信度 0-100%）</text>

  <rect x="680" y="277" width="240" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="800" y="300" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Explanation（预测依据说明）</text>

  <!-- Arrow down to Product Layer -->
  <line x1="480" y1="290" x2="480" y2="350" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Product Layer -->
  <rect x="160" y="360" width="640" height="40" rx="6" fill="#1c2128" stroke="#ffa657" stroke-width="1.5"/>
  <text x="480" y="385" text-anchor="middle" fill="#ffa657" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">🎨 Product Layer（产品层处理 — 核心差异化）</text>

  <!-- High Confidence -->
  <rect x="60" y="420" width="260" height="120" rx="10" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="190" y="448" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">🟢 High ≥80%</text>
  <text x="190" y="472" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">正常预测展示</text>
  <text x="190" y="492" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">确定日期 + ±2天</text>
  <text x="190" y="512" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">可点击查看预测依据</text>
  <text x="190" y="532" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">经期前2天正常提醒</text>

  <!-- Medium Confidence -->
  <rect x="350" y="420" width="260" height="120" rx="10" fill="#2d2410" stroke="#9e6a03" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="480" y="448" text-anchor="middle" fill="#d29922" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">🟡 Medium 50-80%</text>
  <text x="480" y="472" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">明确展示不确定性</text>
  <text x="480" y="492" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">"左右" + ±4-5天显著展示</text>
  <text x="480" y="512" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">默认展开"为什么有不确定性"</text>
  <text x="480" y="532" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">行动指引：多记录提高准确度</text>

  <!-- Low Confidence -->
  <rect x="640" y="420" width="260" height="120" rx="10" fill="#2d1212" stroke="#da3633" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="770" y="448" text-anchor="middle" fill="#f85149" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">🔴 Low &lt;50%</text>
  <text x="770" y="472" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">不给确定日期</text>
  <text x="770" y="492" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">只显示日期范围 ±7天+</text>
  <text x="770" y="512" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">默认展示"如何提高准确度"</text>
  <text x="770" y="532" text-anchor="middle" fill="#f85149" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🚫 绝对不显示确定性表述</text>

  <!-- Key Insight box -->
  <rect x="60" y="570" width="840" height="100" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <text x="80" y="600" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">💡 Key Insight — 为什么这是AI产品经理的核心能力</text>
  <text x="80" y="625" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13">AI产品不能只考虑 happy path。低置信度时，产品的正确做法不是"给一个看起来确定的答案"，</text>
  <text x="80" y="648" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13">而是"诚实告诉用户我不确定，并建议如何获得更确定的结果"。这就是 Predict → Explain → Guide 的产品理念。</text>

  <text x="480" y="700" text-anchor="middle" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">钱彬娴 · LunaCare AI Product Logic · Case 02</text>
</svg>
