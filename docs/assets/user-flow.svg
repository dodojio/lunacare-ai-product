<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30363d"/>
    </marker>
  </defs>

  <rect width="960" height="820" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">LunaCare 核心用户流程图</text>
  <text x="480" y="64" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">User Flow · Onboarding / Daily Log / Delay Scenario</text>

  <!-- ========== Flow A: Onboarding ========== -->
  <rect x="30" y="88" width="900" height="200" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="50" y="112" fill="#79c0ff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Flow A — 首次注册 Onboarding</text>
  <text x="50" y="130" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">设计要点：从Flo的8-10步缩减到3步；隐私选项前置；初始预测诚实标注低置信度</text>

  <!-- Steps -->
  <rect x="50" y="150" width="120" height="50" rx="8" fill="#1c2128" stroke="#79c0ff" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="110" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Splash</text>
  <text x="110" y="188" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">启动页</text>

  <line x1="170" y1="175" x2="195" y2="175" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="200" y="150" width="120" height="50" rx="8" fill="#1c2128" stroke="#79c0ff" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="260" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Onboarding</text>
  <text x="260" y="188" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">3步基础信息</text>

  <line x1="320" y1="175" x2="345" y2="175" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="350" y="150" width="120" height="50" rx="8" fill="#1c2128" stroke="#79c0ff" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="410" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Privacy</text>
  <text x="410" y="188" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">隐私模式选择</text>

  <line x1="470" y1="175" x2="495" y2="175" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="500" y="150" width="140" height="50" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="570" y="172" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Initial Prediction</text>
  <text x="570" y="188" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">AI初始预测(低置信度)</text>

  <line x1="640" y1="175" x2="665" y2="175" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="670" y="150" width="120" height="50" rx="8" fill="#1c2128" stroke="#7ee787" stroke-width="2" filter="url(#shadow3)"/>
  <text x="730" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Home</text>
  <text x="730" y="188" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">首页</text>

  <!-- Decision: 数据不足? -->
  <rect x="810" y="155" width="110" height="40" rx="6" fill="#2d1212" stroke="#da3633" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="865" y="172" text-anchor="middle" fill="#f85149" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">数据不足?</text>
  <text x="865" y="186" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">→ 引导多记录</text>

  <!-- ========== Flow B: Daily Log ========== -->
  <rect x="30" y="308" width="900" height="200" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="50" y="332" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Flow B — 日常记录 Daily Log</text>
  <text x="50" y="350" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">设计要点：核心信息1步完成；AI自动推荐症状标签；记录后即时反馈预测已更新</text>

  <rect x="50" y="370" width="120" height="50" rx="8" fill="#1c2128" stroke="#7ee787" stroke-width="2" filter="url(#shadow3)"/>
  <text x="110" y="392" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Home</text>
  <text x="110" y="408" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">首页</text>

  <line x1="170" y1="395" x2="195" y2="395" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="200" y="370" width="120" height="50" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="260" y="392" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Quick Log</text>
  <text x="260" y="408" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">一键记录入口</text>

  <line x1="320" y1="395" x2="345" y2="395" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="350" y="370" width="140" height="50" rx="8" fill="#1c2128" stroke="#7ee787" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="420" y="392" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Period / Symptom</text>
  <text x="420" y="408" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">经期/症状确认</text>

  <line x1="490" y1="395" x2="515" y2="395" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="520" y="370" width="140" height="50" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="590" y="392" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">AI Recommend</text>
  <text x="590" y="408" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">AI推荐症状标签</text>

  <line x1="660" y1="395" x2="685" y2="395" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="690" y="370" width="120" height="50" rx="8" fill="#1c2128" stroke="#7ee787" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="750" y="392" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Confirm</text>
  <text x="750" y="408" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">确认记录</text>

  <line x1="810" y1="395" x2="835" y2="395" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="840" y="370" width="80" height="50" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="880" y="392" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Prediction</text>
  <text x="880" y="408" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">Updated</text>

  <!-- Feedback loop back to Home -->
  <path d="M 880 420 Q 880 450 480 450 Q 110 450 110 420" fill="none" stroke="#238636" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="465" text-anchor="middle" fill="#238636" font-family="-apple-system, sans-serif" font-size="10">Toast: "记录成功，预测准确度已提升" → 返回Home</text>

  <!-- ========== Flow C: Delay Scenario ========== -->
  <rect x="30" y="528" width="900" height="260" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="50" y="552" fill="#f85149" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Flow C — 经期推迟 Delay Scenario（最关键）</text>
  <text x="50" y="570" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">设计要点：取代"延迟警告"；分级说明（正常波动/需关注/建议就医）；给行动指引而非制造焦虑</text>

  <rect x="50" y="590" width="120" height="44" rx="8" fill="#1c2128" stroke="#7ee787" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="110" y="610" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Prediction Date</text>
  <text x="110" y="625" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">预测日到达</text>

  <line x1="170" y1="612" x2="195" y2="612" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="200" y="590" width="120" height="44" rx="8" fill="#2d1212" stroke="#da3633" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="260" y="610" text-anchor="middle" fill="#f85149" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Delay Detected</text>
  <text x="260" y="625" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">推迟检测</text>

  <line x1="320" y1="612" x2="345" y2="612" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="350" y="590" width="140" height="44" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="420" y="610" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Confidence Re-calc</text>
  <text x="420" y="625" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">置信度重新计算</text>

  <line x1="490" y1="612" x2="515" y2="612" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Branching: 3 levels -->
  <rect x="520" y="590" width="120" height="44" rx="8" fill="#1c2128" stroke="#ffa657" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="580" y="610" text-anchor="middle" fill="#ffa657" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Explain Why</text>
  <text x="580" y="625" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">分级说明+原因</text>

  <!-- 3 branches -->
  <line x1="580" y1="634" x2="580" y2="660" stroke="#30363d" stroke-width="1.5"/>
  <line x1="200" y1="660" x2="900" y2="660" stroke="#30363d" stroke-width="1.5"/>

  <!-- Level 1: Normal -->
  <line x1="250" y1="660" x2="250" y2="680" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <rect x="140" y="680" width="220" height="56" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="250" y="700" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🟢 正常波动 (1-3天)</text>
  <text x="250" y="718" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="10">"仍在正常范围内"</text>
  <text x="250" y="732" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">继续观察，无需行动</text>

  <!-- Level 2: Attention -->
  <line x1="500" y1="660" x2="500" y2="680" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <rect x="390" y="680" width="220" height="56" rx="8" fill="#2d2410" stroke="#9e6a03" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="500" y="700" text-anchor="middle" fill="#d29922" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🟡 需关注 (4-7天)</text>
  <text x="500" y="718" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="10">"推迟时间较长"</text>
  <text x="500" y="732" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">可能原因+记录更多症状</text>

  <!-- Level 3: Doctor -->
  <line x1="750" y1="660" x2="750" y2="680" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <rect x="640" y="680" width="220" height="56" rx="8" fill="#2d1212" stroke="#da3633" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="750" y="700" text-anchor="middle" fill="#f85149" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🔴 建议就医 (7天+)</text>
  <text x="750" y="718" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="10">"建议咨询医生"</text>
  <text x="750" y="732" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="9">明确就医红线+一键预约</text>

  <!-- Bottom note -->
  <text x="480" y="795" text-anchor="middle" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">🚫 绝对不使用"警告""异常""可能怀孕"等焦虑性词汇 | 改用"推迟说明""可能原因""建议观察"等中性赋能性表述</text>

  <text x="480" y="815" text-anchor="middle" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="10">钱彬娴 · LunaCare User Flow · Case 02</text>
</svg>
