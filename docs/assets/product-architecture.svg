<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2128"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">LunaCare 产品功能架构图</text>
  <text x="480" y="64" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">Product Architecture · MVP Scope</text>

  <!-- Top layer: Core Value -->
  <rect x="280" y="88" width="400" height="48" rx="8" fill="#0d2818" stroke="#238636" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="118" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Predict → Explain → Guide</text>

  <!-- Connecting lines -->
  <line x1="480" y1="136" x2="480" y2="160" stroke="#30363d" stroke-width="1.5"/>
  <line x1="120" y1="160" x2="840" y2="160" stroke="#30363d" stroke-width="1.5"/>
  <line x1="120" y1="160" x2="120" y2="180" stroke="#30363d" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="300" y2="180" stroke="#30363d" stroke-width="1.5"/>
  <line x1="480" y1="160" x2="480" y2="180" stroke="#30363d" stroke-width="1.5"/>
  <line x1="660" y1="160" x2="660" y2="180" stroke="#30363d" stroke-width="1.5"/>
  <line x1="840" y1="160" x2="840" y2="180" stroke="#30363d" stroke-width="1.5"/>

  <!-- 5 main modules -->
  <!-- Home -->
  <rect x="40" y="180" width="160" height="56" rx="8" fill="url(#cardGrad)" stroke="#7ee787" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="205" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">🏠 Home</text>
  <text x="120" y="224" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">首页 · 预测中心</text>

  <!-- Calendar -->
  <rect x="220" y="180" width="160" height="56" rx="8" fill="url(#cardGrad)" stroke="#79c0ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="205" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">📅 Calendar</text>
  <text x="300" y="224" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">日历 · 历史记录</text>

  <!-- Insights -->
  <rect x="400" y="180" width="160" height="56" rx="8" fill="url(#cardGrad)" stroke="#d2a8ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="205" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">📊 Insights</text>
  <text x="480" y="224" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">洞察 · 趋势分析</text>

  <!-- AI Companion -->
  <rect x="580" y="180" width="160" height="56" rx="8" fill="url(#cardGrad)" stroke="#ffa657" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="205" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">🤖 AI Companion</text>
  <text x="660" y="224" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">P1 · 对话助手</text>

  <!-- Profile -->
  <rect x="760" y="180" width="160" height="56" rx="8" fill="url(#cardGrad)" stroke="#8b949e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="205" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">👤 Profile</text>
  <text x="840" y="224" text-anchor="middle" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11">设置 · 隐私管理</text>

  <!-- Sub-features for each module -->
  <!-- Home sub -->
  <rect x="40" y="260" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="120" y="283" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Cycle Status</text>

  <rect x="40" y="304" width="160" height="36" rx="6" fill="#0d2818" stroke="#238636" stroke-width="1"/>
  <text x="120" y="327" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">AI Prediction ⭐</text>

  <rect x="40" y="348" width="160" height="36" rx="6" fill="#0d2818" stroke="#238636" stroke-width="1"/>
  <text x="120" y="371" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Confidence ⭐</text>

  <rect x="40" y="392" width="160" height="36" rx="6" fill="#0d2818" stroke="#238636" stroke-width="1"/>
  <text x="120" y="415" text-anchor="middle" fill="#7ee787" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Quick Log ⭐</text>

  <!-- Calendar sub -->
  <rect x="220" y="260" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="300" y="283" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Period History</text>

  <rect x="220" y="304" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="300" y="327" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Prediction View</text>

  <rect x="220" y="348" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="300" y="371" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Symptoms Log</text>

  <!-- Insights sub -->
  <rect x="400" y="260" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="480" y="283" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Cycle Trends</text>

  <rect x="400" y="304" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="480" y="327" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Symptom Patterns</text>

  <rect x="400" y="348" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="480" y="371" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">AI Insights (P1)</text>

  <!-- AI Companion sub -->
  <rect x="580" y="260" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="660" y="283" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Ask Luna</text>

  <rect x="580" y="304" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="660" y="327" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Personalized Explanation</text>

  <rect x="580" y="348" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="660" y="371" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Health Guidance</text>

  <!-- Profile sub -->
  <rect x="760" y="260" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="840" y="283" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Health Data</text>

  <rect x="760" y="304" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="840" y="327" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Privacy Settings</text>

  <rect x="760" y="348" width="160" height="36" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="840" y="371" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="12">Data Export / Delete</text>

  <!-- Bottom: Data Layer -->
  <rect x="40" y="460" width="880" height="56" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="60" y="485" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">数据层 / Data Layer</text>
  <text x="60" y="505" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">Cycle History · Sleep Data · Activity Data · Symptoms · Stress Level · User Profile</text>

  <!-- Legend -->
  <rect x="40" y="540" width="880" height="72" rx="8" fill="#161b22" stroke="#21262d"/>
  <text x="60" y="565" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">图例 / Legend</text>

  <rect x="60" y="578" width="14" height="14" rx="3" fill="#0d2818" stroke="#238636"/>
  <text x="82" y="590" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="11">P0 核心功能 (MVP)</text>

  <rect x="220" y="578" width="14" height="14" rx="3" fill="#161b22" stroke="#21262d"/>
  <text x="242" y="590" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="11">基础功能</text>

  <rect x="340" y="578" width="14" height="14" rx="3" fill="#161b22" stroke="#ffa657"/>
  <text x="362" y="590" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="11">P1 后续迭代</text>

  <text x="520" y="590" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">⭐ = MVP 4个P0核心功能</text>

  <text x="480" y="625" text-anchor="middle" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="11">钱彬娴 · LunaCare Product Architecture · Case 02</text>
</svg>
